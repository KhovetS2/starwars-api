services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starwars-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=starwars_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - starwars-network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: starwars-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - starwars-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  starwars-network:
    driver: bridge

volumes:
  mongodb_data:
