[project]
name = "startwars-api"
version = "0.1.0"
description = "Star Wars API built with FastAPI consuming SWAPI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi[standard]>=0.128",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "motor>=3.3",
  "python-jose[cryptography]>=3.3",
  "passlib>=1.7",
  "bcrypt>=4.0,<4.1",  # Pinned for passlib compatibility
  # GCP Cloud Functions
  "functions-framework>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "mongomock-motor>=0.0.29",
  "ruff",
  "black",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
